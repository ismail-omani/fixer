{% extends "base.html" %}
{% block content %}
<section class="toolbar">
  <form class="search" method="get" action="{{ url_for('completed' if mode == 'completed' else 'index') }}">
    <input type="text" name="q" value="{{ q }}" placeholder="{{ t('index.search_placeholder') }}">
    <button type="submit" class="btn">{{ t('index.search_btn') }}</button>
  </form>
  <a class="btn primary plus" href="{{ url_for('new_task') }}" title="{{ t('index.create') }}">+</a>
</section>

<div class="tabs">
  <a href="{{ url_for('index') }}" class="{{ 'on' if mode == 'active' }}">{{ t('index.tab_active') }}</a>
  <a href="{{ url_for('completed') }}" class="{{ 'on' if mode == 'completed' }}">{{ t('index.tab_completed') }}</a>
</div>

<div id="task-feed" data-mode="{{ mode }}">
  {% include "_feed.html" %}
</div>
{% endblock %}
